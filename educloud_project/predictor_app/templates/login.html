<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduCloud - Secure Access</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --primary: #3b82f6; --primary-hover: #2563eb; --input-bg: #0f172a; --border: #334155; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-container { background: var(--card); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
        h1 { margin-bottom: 10px; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
        p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { font-weight: 600; font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; box-sizing: border-box; outline: none; transition: border 0.3s; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .btn { width: 100%; padding: 14px; margin-top: 10px; font-size: 16px; font-weight: bold; color: white; background-color: var(--primary); border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-success { background-color: #10b981; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3); }
        .btn-success:hover { background-color: #059669; }
        .toggle-link { color: var(--primary); cursor: pointer; font-size: 14px; margin-top: 20px; display: inline-block; font-weight: 500; }
        .toggle-link:hover { text-decoration: underline; }
        .error-msg { background-color: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="auth-container" id="login-box">
        <h1>☁️ EduCloud AI</h1>
        <p>Secure System Access</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="login">
            <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
            <button type="submit" class="btn">Authenticate</button>
        </form>
        <span class="toggle-link" onclick="toggleForms()">Request System Access (Sign Up)</span>
    </div>

    <div class="auth-container" id="signup-box" style="display: none;">
        <h1>✨ Initialize User</h1>
        <p>Register for EduCloud platform access.</p>
        
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="signup">
            <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
            <div class="form-group">
                <label>Clearance Level</label>
                <select name="role">
                    <option value="student">Student Portal</option>
                    <option value="teacher">Educator Portal</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Initialize Account</button>
        </form>
        <span class="toggle-link" onclick="toggleForms()">Return to Authentication</span>
    </div>

<script>
    function toggleForms() {
        const loginBox = document.getElementById('login-box');
        const signupBox = document.getElementById('signup-box');
        loginBox.style.display = loginBox.style.display === 'none' ? 'block' : 'none';
        signupBox.style.display = signupBox.style.display === 'none' ? 'block' : 'none';
    }
</script>
</body>
</html>
